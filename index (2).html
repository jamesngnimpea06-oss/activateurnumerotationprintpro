<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back-Office - Générateur de Clés de Licence</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.5rem;
            color: #38bdf8;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .btn {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-copy {
            background-color: var(--border-color);
            margin-top: 0.5rem;
        }

        .btn-copy:hover {
            background-color: #475569;
        }

        .result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #0f172a;
            border: 1px dashed #38bdf8;
            border-radius: 6px;
            font-family: monospace;
            font-size: 1.2rem;
            color: #38bdf8;
            text-align: center;
            word-break: break-all;
            letter-spacing: 1px;
        }

        .history-section {
            margin-top: 1rem;
        }

        .history-title {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .history-list {
            max-height: 150px;
            overflow-y: auto;
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.5rem;
            font-size: 0.8rem;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .history-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>🔑 Back-Office (Générateur Web)</h1>
        <p class="subtitle">Génération de clés d'activation d'application pour les clients</p>
        
        <div class="form-group">
            <label for="clientName">Nom du Client / Entreprise</label>
            <input type="text" id="clientName" placeholder="ex: Jean Dupont / Société SARL">
        </div>

        <div class="form-group">
            <label for="clientHwid">Identifiant Matériel (HWID) du Client</label>
            <input type="text" id="clientHwid" placeholder="ex: HWID-EA0F-88A3-1106">
        </div>

        <div class="form-group">
            <label for="duration">Durée de l'Abonnement</label>
            <select id="duration">
                <option value="30">30 Jours</option>
                <option value="90">90 Jours</option>
                <option value="180">6 Mois (180 Jours)</option>
                <option value="365">1 An (365 Jours)</option>
            </select>
        </div>

        <button class="btn" onclick="generateKey()">Générer la Clé Produit</button>

        <div class="result-box" id="resultKey">----- ----- ----- -----</div>
        <button class="btn btn-copy" onclick="copyKey()">Copier la Clé</button>

        <div class="history-section">
            <p class="history-title">Dernières clés générées :</p>
            <div class="history-list" id="historyList">
                <em style="color: var(--text-muted);">Aucune clé générée pour le moment.</em>
            </div>
        </div>
    </div>
</div>

<script>
    // Clé secrète d'administration (STRICTEMENT IDENTIQUE à celle de votre application installable)
    const SECRET_KEY = "VOTRE_CLE_SECRETE_SUPER_SECURISEE_2026";

    /**
     * Génère la clé de licence HMAC-SHA256
     */
    async function generateKey() {
        const clientName = document.getElementById("clientName").value.trim();
        const hwid = document.getElementById("clientHwid").value.trim();
        const durationDays = parseInt(document.getElementById("duration").value);

        if (!clientName || !hwid) {
            alert("Veuillez remplir le nom du client et son HWID.");
            return;
        }

        // 1. Calcul de la date d'expiration (YYYY-MM-DD)
        const expDate = new Date();
        expDate.setDate(expDate.getDate() + durationDays);
        const expDateStr = expDate.toISOString().split('T')[0];

        // 2. Création de la charge utile : HWID|YYYY-MM-DD
        const payload = `${hwid}|${expDateStr}`;

        // 3. Signature HMAC-SHA256 avec la Web Crypto API
        const encoder = new TextEncoder();
        const keyData = encoder.encode(SECRET_KEY);
        const msgData = encoder.encode(payload);

        const cryptoKey = await crypto.subtle.importKey(
            'raw', keyData, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
        );

        const signatureBuffer = await crypto.subtle.sign('HMAC', cryptoKey, msgData);
        const fullSignature = Array.from(new Uint8Array(signatureBuffer))
            .map(b => b.toString(16).padStart(2, '0'))
            .join('');

        // 4. Extraction des 16 premiers caractères hexadécimaux
        const shortSignature = fullSignature.substring(0, 16).toUpperCase();

        // 5. Encodage de la date en Base64 sans bourrage '='
        const encodedDate = btoa(expDateStr).replace(/=/g, '');

        // 6. Assemblage et formatage sous la forme XXXX-XXXX-XXXX-XXXX
        const rawKey = `${encodedDate}${shortSignature}`;
        const formattedKey = rawKey.match(/.{1,4}/g).join('-');

        // Affichage du résultat
        document.getElementById("resultKey").innerText = formattedKey;

        // Enregistrement dans l'historique local
        saveToHistory(clientName, expDateStr, formattedKey);
    }

    /**
     * Copie la clé dans le presse-papier
     */
    function copyKey() {
        const keyText = document.getElementById("resultKey").innerText;
        if (keyText.includes("-") && !keyText.includes("-----")) {
            navigator.clipboard.writeText(keyText);
            alert("Clé copiée dans le presse-papier !");
        }
    }

    /**
     * Sauvegarde et affichage de l'historique dans le localStorage
     */
    function saveToHistory(name, expDate, key) {
        let history = JSON.parse(localStorage.getItem("admin_license_history") || "[]");
        history.unshift({ name, expDate, key, date: new Date().toLocaleDateString() });
        if (history.length > 5) history.pop(); // Garde les 5 dernières
        localStorage.setItem("admin_license_history", JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        let history = JSON.parse(localStorage.getItem("admin_license_history") || "[]");
        const listEl = document.getElementById("historyList");
        
        if (history.length === 0) return;

        listEl.innerHTML = history.map(item => `
            <div class="history-item">
                <span><strong>${item.name}</strong> (${item.expDate})</span>
                <span style="color: #38bdf8; font-family: monospace;">${item.key}</span>
            </div>
        `).join('');
    }

    // Charger l'historique au démarrage
    document.addEventListener("DOMContentLoaded", renderHistory);
</script>

</body>
</html>
